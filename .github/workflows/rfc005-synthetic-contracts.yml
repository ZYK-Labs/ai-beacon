name: AI Beacon RFC-005 synthetic contracts

on:
  pull_request:
    paths:
      - "research/rfc005/**"
      - "PROJECT_STATE.md"
      - "handoffs/AI_BEACON_HANDOFF_2026-10-11_RFC005_FINAL_ACTIONS.md"
      - ".github/workflows/rfc005-synthetic-contracts.yml"
  push:
    branches: [main]
    paths:
      - "research/rfc005/**"
      - ".github/workflows/rfc005-synthetic-contracts.yml"

permissions:
  contents: read

jobs:
  synthetic-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify RFC-005 AI-BEACON final-action contracts
        run: node research/rfc005/verify-all.mjs
