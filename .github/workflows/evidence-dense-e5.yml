name: AI Beacon E5 dense experiment

on:
  pull_request:
    paths:
      - "evidence/**"
      - ".github/workflows/evidence-dense-e5.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dense-e5:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: evidence/experiments/multilingual-e5-small-v1/requirements.txt

      - name: Verify frozen no-model baseline first
        working-directory: evidence
        run: |
          npm run check
          npm test
          npm run benchmark

      - name: Export lexical candidate sets
        working-directory: evidence/experiments/multilingual-e5-small-v1
        run: node export_lexical.mjs > lexical-results.json

      - name: Install pinned CPU runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.0.1
          python -m pip install -r evidence/experiments/multilingual-e5-small-v1/requirements.txt

      - name: Run pinned multilingual-e5-small benchmark
        working-directory: evidence/experiments/multilingual-e5-small-v1
        run: python dense_benchmark.py

      - name: Upload benchmark result
        uses: actions/upload-artifact@v4
        with:
          name: multilingual-e5-small-v1-results
          path: |
            evidence/experiments/multilingual-e5-small-v1/results.json
            evidence/experiments/multilingual-e5-small-v1/lexical-results.json
          if-no-files-found: error
          retention-days: 30
